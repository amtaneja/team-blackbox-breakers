[project]
name = "document-ai-api"
version = "0.1.0"
description = "FastAPI service for processing uploaded PDFs with Google Cloud Document AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-cloud-documentai>=2.30,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false
